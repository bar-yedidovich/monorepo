# pnpm workspace members (not package.json "workspaces" — that is npm/Yarn only)
packages:
    - 'apps/*'
    - 'packages/*'
    - 'tooling/*'
    - 'shared'

# Single source of truth for dependency versions across the monorepo.
# In package.json: "typescript": "catalog:"
catalog:
    '@eslint/js': 9.39.4
    '@types/node': 24.0.0
    '@types/react': 18.2.0
    '@types/react-dom': 18.2.0
    '@vitejs/plugin-react': 6.0.1
    '@vitest/coverage-v8': 4.1.7
    eslint: 9.39.4
    eslint-config-prettier: 10.1.8
    eslint-plugin-jsx-a11y: 6.10.2
    eslint-plugin-react: 7.37.5
    eslint-plugin-react-hooks: 7.1.1
    eslint-plugin-security: 4.0.0
    globals: 17.5.0
    husky: 9.1.7
    lint-staged: 17.0.5
    prettier: 3.8.3
    react: 18.2.0
    react-dom: 18.2.0
    typescript: 6.0.3
    typescript-eslint: 8.58.2
    vite: 8.0.10
    vitest: 4.1.7
